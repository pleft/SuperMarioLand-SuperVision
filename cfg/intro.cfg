# INTRO -- the ELEFAS boot splash blob (docs/48): linked at $1500 (the RAM
# overlay window) and pasted by make_512k into a free 512K page (13). reset
# copies it into the window and runs it before the title.
MEMORY {
    INTROM: start $1500, size $0800, type rw, file %O, fill no;
}
SEGMENTS {
    INTRO: load INTROM type rw;
}
