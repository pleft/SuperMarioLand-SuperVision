# ld65 config for the standalone W2 overlay blob: runs in the $1500 window,
# shipped inside each W2 bank's level region (see tools/pack_banks.py).
# 2-3 (MAR23): the window is capped at $7D0 (the $1CD0-$1CFF tail hosts the
# bank-6 bootstrap's relocated loader) and the overflow lives in W2FAR --
# BANK-RESIDENT code at $A260 (the bank stays mapped for the whole frame).
MEMORY {
    W2WIN:  start $1500 size $0800 type ro file %O;
    W2FARM: start $A600 size $0680 type ro file %O;   # +128: the vertical
                                                     # cull (l3_cull) and veh_crush   # moved up: the shared
                                                     # prefix grew when p4_one
                                                     # left the full FIXED bank
}
SEGMENTS {
    W2C:   load W2WIN  type ro;
    W2FAR: load W2FARM type ro optional yes;
    CODE:  load W2WIN  type ro optional yes;   # ca65's default segment (empty)
}
