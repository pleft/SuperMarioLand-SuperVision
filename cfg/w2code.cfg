# ld65 config for the standalone W2 overlay blob: runs in the $1500 window,
# shipped inside each W2 bank's level region (see tools/pack_banks.py).
MEMORY {
    W2WIN: start $1500 size $0800 type ro file %O;
}
SEGMENTS {
    W2C:  load W2WIN type ro;
    CODE: load W2WIN type ro optional yes;   # ca65's default segment (empty)
}
