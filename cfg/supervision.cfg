# ld65 config — Watara Supervision 32K cartridge (2 x 16K banks).
# Cart maps: last 16K -> $C000-$FFFF (fixed, holds vectors); a selectable 16K -> $8000.
# File layout: [BANK0 16K][FIXED 16K].  See docs/20-supervision-hardware.md.

MEMORY {
    ZP:    start $0000 size $0100 type rw define yes;        # zero page
    RAM:   start $0200 size $1E00 type rw define yes;        # WRAM (above stack)
    BANK0: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # selectable bank 0
    FIXED: start $C000 size $4000 type ro file %O fill yes fillval $FF;  # fixed (last) bank
}

SEGMENTS {
    ZEROPAGE: load ZP    type zp  optional yes;
    BSS:      load RAM   type bss optional yes;
    BANK0:    load BANK0 type ro  optional yes;     # switchable-bank data
    CODE:     load FIXED type ro;
    RODATA:   load FIXED type ro  optional yes;
    CHARS:    load FIXED type ro  optional yes;     # converted SV tiles (fixed bank, always mapped)
    LEVELS:   load BANK0 type ro  optional yes;     # level tilemap data -> selectable bank 0
                                                    # ($8000, always mapped on a 32K cart) to free
                                                    # ~5.5K of the fixed bank for code
    VECTORS:  load FIXED type ro  start $FFFA;       # NMI, RESET, IRQ
}
