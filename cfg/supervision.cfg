# ld65 config — Watara Supervision 64K cartridge (4 x 16K banks).
# Cart maps: last 16K -> $C000-$FFFF (fixed, holds vectors); a selectable 16K -> $8000
# (SYS_CTRL $2026 bits 7:5). File layout: [BANK0][BANK1][BANK2][FIXED].
#
# BANK0 = the linked LEVELS segment: the COMMON PREFIX (audio engine+data, BG charset,
# banked code, engine tables, title) followed by level_hdr + World 1-1's data (the
# leveldata.o tail). BANK1/BANK2 are emitted as $FF fill here and then rewritten by
# tools/pack_banks.py: the same common prefix with level 1 / level 2 data + header at
# the identical offset, so every symbol in the prefix (and level_hdr itself) resolves
# at the same address whichever bank is mapped.  See docs/20-supervision-hardware.md.

MEMORY {
    ZP:    start $0000 size $0100 type rw define yes;        # zero page
    RAM:   start $0200 size $1E00 type rw define yes;        # WRAM (above stack)
    BANK0: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # bank 0 (level 0 + common)
    BANK1: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # bank 1 (packed post-link)
    BANK2: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # bank 2 (packed post-link)
    FIXED: start $C000 size $4000 type ro file %O fill yes fillval $FF;  # fixed (last) bank
    L3RAM: start $1500 size $0800 type rw define yes;        # 1-3 kit code, copied from bank 2
}

SEGMENTS {
    ZEROPAGE: load ZP    type zp  optional yes;
    BSS:      load RAM   type bss optional yes;
    CODE:     load FIXED type ro;
    RODATA:   load FIXED type ro  optional yes;
    CHARS:    load FIXED type ro  optional yes;     # converted SV tiles (fixed bank, always mapped)
    LEVELS:   load BANK0 type ro  optional yes;               # the COMMON PREFIX (every bank)
    TITLE0:   load BANK0 type ro  optional yes  define = yes; # title data: bank 0 ONLY — banks
                                                              # 1+ reuse this range for their
                                                              # level region (pack_banks.py)
    LEVEL0:   load BANK0 type ro  optional yes;               # level_hdr + World 1-1 data
    L12:      load BANK0 type ro  optional yes;               # 1-2-ONLY entity code (bunbun/
                                                              # arrow): runs only with bank 0
                                                              # mapped, like TITLE0
    L3CODE:   load BANK2 run L3RAM type ro optional yes define = yes;
                                                              # 1-3-only code+data. The packer moves the
                                                              # blob to the TITLE0 address in bank 2 (level
                                                              # header + data follow it); load_level copies
                                                              # it to RAM $1500 when 1-3 loads.
    VECTORS:  load FIXED type ro  start $FFFA;       # NMI, RESET, IRQ
}
