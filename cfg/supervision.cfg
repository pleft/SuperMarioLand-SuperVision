# ld65 config — Watara Supervision 128K cartridge (8 x 16K banks).
# Cart maps: last 16K -> $C000-$FFFF (fixed, holds vectors); a selectable 16K -> $8000
# (SYS_CTRL $2026 bits 7:5; Potator: bankOffset = (reg & $E0) << 9, mod ROM size, and
# upperRomBank = last 16K of the file regardless of size — verified from memorymap.c).
# File layout: [BANK0][BANK1][BANK2][BANK3..BANK6][FIXED]. Banks 3-6 are $FF fill
# reserved for Worlds 2-4 (level data via pack_banks.py, overlays via new segments).
#
# BANK0 = the linked LEVELS segment: the COMMON PREFIX (audio engine+data, BG charset,
# banked code, engine tables, title) followed by level_hdr + World 1-1's data (the
# leveldata.o tail). BANK1/BANK2 are emitted as $FF fill here and then rewritten by
# tools/pack_banks.py: the same common prefix with level 1 / level 2 data + header at
# the identical offset, so every symbol in the prefix (and level_hdr itself) resolves
# at the same address whichever bank is mapped.  See docs/20-supervision-hardware.md.

MEMORY {
    ZP:    start $0000 size $0100 type rw define yes;        # zero page
    RAM:   start $0200 size $1E00 type rw define yes;        # WRAM (above stack)
    BANK0: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # bank 0 (level 0 + common)
    BANK1: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # bank 1 (packed post-link)
    BANK2: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # bank 2 (packed post-link)
    BANK3: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # W2+ (reserved, $FF fill)
    BANK4: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # W2+ (reserved, $FF fill)
    BANK5: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # W2+ (reserved, $FF fill)
    BANK6: start $8000 size $4000 type ro file %O fill yes fillval $FF;  # W2+ (reserved, $FF fill)
    FIXED: start $C000 size $4000 type ro file %O fill yes fillval $FF;  # fixed (LAST) bank
    RCRAM: start $1200 size $0300 type rw define yes;        # ALWAYS-RESIDENT RAM CODE (ring
                                                             # helpers, HUD flush): copied from
                                                             # bank 6 by boot6_init, lives below
                                                             # the $1500 overlay window
    L3RAM: start $1500 size $0800 type rw define yes;        # 1-3 kit code, copied from bank 2
    L1RAM: start $1500 size $0800 type rw define yes;        # SAME window: the bonus-game code,
                                                             # copied from bank 1 at bonus entry
                                                             # (never coexists with the 1-3 kit;
                                                             # load_level restores the right one)
    L13RAM: start $1500 size $0800 type rw define yes;
    BOOTRAM: start $1500 size $0800 type rw define yes;      # SAME window: the one-shot
                                                             # boot bulk (runs before any
                                                             # overlay is ever loaded)       # SAME window again: the x-3 ending
                                                             # room scenes, copied from bank 1
                                                             # once the sphere retires the kit
}

SEGMENTS {
    ZEROPAGE: load ZP    type zp  optional yes;
    BSS:      load RAM   type bss optional yes;
    CODE:     load FIXED type ro;
    RODATA:   load FIXED type ro  optional yes;
    CHARS:    load FIXED type ro  optional yes;     # converted SV tiles (fixed bank, always mapped)
    LEVELS:   load BANK0 type ro  optional yes;               # the COMMON PREFIX (every bank)
    TITLE0:   load BANK0 type ro  optional yes  define = yes; # title data: bank 0 ONLY — banks
                                                              # 1+ reuse this range for their
                                                              # level region (pack_banks.py)
    LEVEL0:   load BANK0 type ro  optional yes;               # level_hdr + World 1-1 data
    L12:      load BANK0 type ro  optional yes;               # 1-2-ONLY entity code (bunbun/
                                                              # arrow): runs only with bank 0
                                                              # mapped, like TITLE0
    L11CODE:  load BANK1 run L1RAM type ro optional yes define = yes;
                                                              # the bonus game: bank-1-resident blob
                                                              # (packer moves it to the TITLE0 addr),
                                                              # copied to RAM $1500 at bonus entry
    L13E:     load BANK1 run L13RAM type ro optional yes define = yes;
                                                              # x-3 ending room machine: bank-1 blob
                                                              # right after L11CODE, copied to $1500
                                                              # at the wipe (L3CODE is done by then)
    RCODE:    load BANK6 run RCRAM type ro optional yes define = yes;
                                                              # always-resident RAM code blob:
                                                              # boot6_init copies it to $1200
    BOOT6:    load BANK6 run BOOTRAM type ro optional yes define = yes;
                                                              # one-shot boot code: copied
                                                              # to the $1500 window and RUN
                                                              # FROM RAM -- real-hw boots
                                                              # died executing long loops
                                                              # through the cart window
    L3CODE:   load BANK2 run L3RAM type ro optional yes define = yes;
                                                              # 1-3-only code+data. The packer moves the
                                                              # blob to the TITLE0 address in bank 2 (level
                                                              # header + data follow it); load_level copies
                                                              # it to RAM $1500 when 1-3 loads.
    VECTORS:  load FIXED type ro  start $FFFA;       # NMI, RESET, IRQ
}
