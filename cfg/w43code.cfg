# World-4 SKY POP (4-3) kit link map: the W4 kit plus the vehicle player in a
# big resident far segment (page 11 has $A680-$AFFF free: no L11CODE/L13E dead
# copies are needed there). Otherwise the W4 kit link map: identical to w3code.cfg except the walk pin (page 10 is
# packed edge to edge for three levels' maps -- docs/45).
# World-3 kit link map. The $1500 RAM window holds the hot code (the AI-VM
# core, the map reader, the draw walk); the FAR segment is BANK-RESIDENT in
# bank 1's tail -- bank 1 IS the W3 resident bank, so far code runs with no
# bank juggling at all (unlike 2-3, whose far code shares a level's bank).
MEMORY {
    W2WIN:  start $1500 size $0700 type ro file %O;   # capped at $1BFF: $1C00-$1C3F himod (main.s), $1C70+ the composer stash CS_A
    W2FARM: start $BE58 size $01A8 type ro file %O;   # moved up: the W3 tail
                                                     # grew when the stub took
                                                     # the MAGNUM sequence
    W3XM:   start $BE00 size $0200 type ro file %O;   # page-10 draw-walk (W4: docs/45 layout)
    W3XM2:  start $86F8 size $03C8 type ro file %O;   # W4: after the page-aligned window image at $8000 (docs/45)   # bank-6 head: the stash's
                                                     # code+tables (docs/42): only
                                                     # ever executed inside
                                                     # w3_draw's bank-6 window
    W3TABM: start $B000 size $0520 type ro file %O;   # RESIDENT-bank per-type
                                                     # tables (docs/45): $B000..
                                                     # $B51F, below the ball pin
                                                     # $B520 / W3HDR $B540. Listed
                                                     # LAST so its bytes end the
                                                     # .bin (the packers slice in
                                                     # MEMORY order).
    SKYFARM: start $A6A6 size $095A type ro file %O;  # page-11 resident: the vehicle
                                                     # player; $A67E-$A6A5 is the
                                                     # prefix's statusbar_tiles
                                                     # (read from THIS page: the
                                                     # 4-3 HUD was garbage at $A680)
                                                     # player (veh_step & co.)
}
SEGMENTS {
    W2C:   load W2WIN  type ro;
    W2FAR: load W2FARM type ro;
    W3X:   load W3XM   type ro optional yes;
    W3X2:  load W3XM2  type ro optional yes;
    W3TAB: load W3TABM type ro optional yes;
    SKYFAR: load SKYFARM type ro optional yes;
}
