# The GAME ENDING blob (src/ending43.s, docs/46): linked to RUN in the $1500
# overlay window, STORED in page 12 (4-3's cold page, which has ~2 KB free) and
# pulled in by the L13E boot stub after the tally. $1500-$1AFF code+text;
# $1B00-$1BFF is its RAM (text buffer + vars); the 38 sprite tiles live in the
# HUD shadow ($1D00-$1F5F, unused during the ending). FIXED is full: nothing here
# may need a resident byte.
MEMORY {
    E43RAM: start $1500 size $0700 type ro file %O;
    E43DAT: start $A300 size $0100 type ro file "build/e43d.bin";   # page 12: the scripts (fetch_txt)
}
SEGMENTS {
    E43: load E43RAM type ro;
    E43D: load E43DAT type ro;
}
