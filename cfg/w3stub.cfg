MEMORY {
    STUB1M: start $1500 size $0100 type ro file %O;
    STUB2M: start $1F80 size $0080 type rw file "";   # $1F80-$1FFF: the W3 column-cache
                                                      # tags ($1F80-$1F9F) are written only
                                                      # AFTER the stub jumps to the kit, and
                                                      # the composer's stash ($1FA0+) is off
}
SEGMENTS {
    STUB1: load STUB1M type ro;
    STUB2: load STUB1M run STUB2M type ro define yes;
}
